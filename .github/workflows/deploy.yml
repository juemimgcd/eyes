name: Build and deploy Eyes
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: eyes-production
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.12.2
      - name: Check backend
        run: |
          uv sync --frozen
          uv run ruff check .
          uv run ruff format --check .
      - name: Check frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          VITE_BASE_PATH=/eyes/ npm run build
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish control image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ghcr.io/juemimgcd/eyes-control:${{ github.sha }}
          cache-from: type=gha,scope=control
          cache-to: type=gha,scope=control,mode=max
      - name: Publish frontend image
        uses: docker/build-push-action@v7
        with:
          context: frontend
          push: true
          build-args: VITE_BASE_PATH=/eyes/
          tags: ghcr.io/juemimgcd/eyes-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.EYES_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.EYES_DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy exact commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.actor }}
          REVISION: ${{ github.sha }}
        run: |
          release="/opt/eyes/releases/$REVISION"
          ssh eyes-deploy@124.223.14.145 "mkdir -p '$release'"
          printf 'EYES_CONTROL_IMAGE=ghcr.io/juemimgcd/eyes-control:%s\nEYES_FRONTEND_IMAGE=ghcr.io/juemimgcd/eyes-frontend:%s\n' "$REVISION" "$REVISION" > deploy/images.env
          scp deploy/compose.yaml deploy/compose.cloud.yaml deploy/release.sh deploy/images.env "eyes-deploy@124.223.14.145:$release/"
          printf '%s' "$GH_TOKEN" | ssh eyes-deploy@124.223.14.145 "docker login ghcr.io -u '$GH_USER' --password-stdin"
          trap 'ssh eyes-deploy@124.223.14.145 "docker logout ghcr.io"' EXIT
          ssh eyes-deploy@124.223.14.145 "bash '$release/release.sh'"
          curl --fail --silent --show-error https://www.mneme.com.cn/eyes/api/health/ready
