name: Build and deploy Eyes

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

# Keep the release and its shared rsync cache serialized, including manual reruns.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'eyes-production' || github.run_id }}
  cancel-in-progress: false

jobs:
  checks:
    name: CI
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  images:
    name: Publish
    needs: checks
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/images.yml
    with:
      publish: true

  deploy:
    name: Deploy production
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    env:
      COMPOSE_PROJECT_NAME: eyes-preflight
      COMPOSE_FILE: deploy/compose.yaml:deploy/compose.cloud.yaml:deploy/compose.tunnel.yaml
      COMPOSE_ENV_FILES: deploy/images.env
      POSTGRES_PASSWORD: ci
      RABBITMQ_PASSWORD: ci
      DEPLOY_TARGET: eyes-deploy@124.223.14.145
      REVISION: ${{ github.sha }}
      IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/eyes
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check release is still the main branch tip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          main=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$main" != "$REVISION" ]]; then
            echo "::error::Release $REVISION has been superseded by main at $main"
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Prepare verified release images
        run: |
          mkdir "$RUNNER_TEMP/eyes-images"
          images=()
          for component in control frontend gateway; do
            digest=$(cat "$RUNNER_TEMP/digests/$component.digest")
            repository="$IMAGE_PREFIX-$component"
            image="$repository:$REVISION"
            docker pull --platform linux/amd64 "$repository@$digest"
            docker tag "$repository@$digest" "$image"
            images+=("$image")
            printf 'EYES_%s_IMAGE=%s\n' "${component^^}" "$image" >> deploy/images.env
            printf '%s@%s\n' "$repository" "$digest" >> deploy/image-digests.txt
          done
          docker save "${images[@]}" | tar -xf - -C "$RUNNER_TEMP/eyes-images"
      - name: Rehearse migration and startup with the published images
        id: rehearsal
        run: |
          docker compose up -d --no-build --wait --wait-timeout 180 postgres redis rabbitmq
          docker compose run --rm --no-deps migrate
          docker compose up -d --no-build --no-deps --wait --wait-timeout 180 \
            api scheduler publisher result-consumer frontend gateway
          curl --fail --silent --show-error --max-time 15 http://127.0.0.1:8180/api/health/ready
      - name: Show rehearsal diagnostics
        if: failure() && steps.rehearsal.outcome == 'failure'
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail=60
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.EYES_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.EYES_DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          umask 077
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Stage release and transfer changed image layers
        run: |
          release="/opt/eyes/releases/$REVISION"
          ssh "$DEPLOY_TARGET" mkdir -p "$release"
          scp deploy/compose{,.cloud,.tunnel,.tunnel.cloud}.yaml deploy/release.sh \
            deploy/images.env deploy/image-digests.txt "$DEPLOY_TARGET:$release/"
          rsync --recursive --checksum --partial-dir=.rsync-partial --delete-delay --info=progress2 --stats \
            "$RUNNER_TEMP/eyes-images/" "$DEPLOY_TARGET:/opt/eyes/image-cache/"
      - name: Import, migrate and verify release
        run: |
          ssh "$DEPLOY_TARGET" 'bash -o pipefail -c "tar --exclude=.rsync-partial -C /opt/eyes/image-cache -cf - . | docker load"'
          release_script="/opt/eyes/releases/$REVISION/release.sh"
          # The checked commit SHA determines the remote script path on the runner.
          # shellcheck disable=SC2029
          ssh "$DEPLOY_TARGET" bash "$release_script"
          curl --fail --silent --show-error --max-time 20 https://www.mneme.com.cn/eyes/api/health/ready
          {
            printf 'Deployed %s to [Eyes](https://www.mneme.com.cn/eyes/).\n\n' "$REVISION"
            cat deploy/image-digests.txt
          } >> "$GITHUB_STEP_SUMMARY"
