server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 8m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    # Resolve lazily: the optional Gateway need not exist for ordinary Eyes deployments.
    resolver 127.0.0.11 valid=10s;
    location = /tunnel/connect {
        set $tunnel_gateway gateway:8090;
        proxy_pass http://$tunnel_gateway/connect;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
    location /tunnel/downloads/ {
        set $tunnel_gateway gateway:8090;
        rewrite ^/tunnel/(.*)$ /$1 break;
        proxy_pass http://$tunnel_gateway;
    }
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
    # FastAPI docs use root-relative OpenAPI and /v1 URLs.
    location /v1/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }
    location = /openapi.json {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }
    location /docs {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
