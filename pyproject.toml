[project]
name = "eyes"
version = "0.1.0"
description = "Self-hosted Agent evaluation and execution observation control plane"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.16,<2",
    "fastapi>=0.118.3,<1",
    "httpx>=0.28,<1",
    "jsonschema>=4.25,<5",
    "opentelemetry-sdk>=1.38,<2",
    "pika>=1.3.2,<2",
    "psycopg[binary]>=3.3,<4",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.11,<3",
    "redis>=7,<8",
    "sqlalchemy>=2.0.44,<2.1",
    "uvicorn>=0.37,<1",
]

[dependency-groups]
dev = ["ruff>=0.13,<1"]

[project.scripts]
eyes-server = "eyes.server.main:main"
eyes-scheduler = "eyes.server.scheduling.worker:main"
eyes-admin = "eyes.server.admin:main"
eyes-runner = "eyes.runner.main:main"
eyes = "eyes.cli.main:main"
eyes-ops = "eyes.server.operations.main:main"
eyes-agent = "eyes.agent_service.main:main"
eyes-publisher = "eyes.server.realtime.publisher:main"
eyes-event-consumer = "eyes.server.event_queue.worker:main"
eyes-result-consumer = "eyes.server.result_queue.worker:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eyes"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
